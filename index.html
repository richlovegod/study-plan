<head>

<title>SAA-C03 讀書計畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F7FB;--grid:#DFE8F1;--ink:#2F3542;--coral:#F2A497;--yellow:#F6D27A;--water:#A8D3E6;--green:#B9DAA5;--water-t:#E4F1F8;--yellow-t:#FCF1D3}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink)}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
button{touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .12s ease-out}
button:active{transform:scale(.97)}
body{font-family:'Huninn','jf-openhuninn','PingFang TC','Microsoft JhengHei',sans-serif;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 18px;line-height:1.6}
.gate{width:100%;max-width:360px;text-align:center}
.pic{border:3px solid var(--ink);border-radius:26px;background:var(--water-t);padding:16px 0 6px;margin-bottom:16px;overflow:hidden}
.pic svg{width:170px;height:auto;display:block;margin:0 auto}
h1{font-weight:400;font-size:27px;margin:0 0 2px}
.lead{margin:0 0 14px;font-size:14px}
form{border:3px solid var(--ink);border-radius:22px;padding:16px;background:var(--yellow-t);text-align:left}
label.pw{display:block;font-size:14px;margin-bottom:6px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;font:inherit;font-size:18px;border:3px solid var(--ink);border-radius:14px;padding:7px 12px;background:#fff;color:var(--ink)}
.row input:focus-visible,.eye:focus-visible,.go:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.eye{flex:0 0 auto;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:0 12px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.rem{display:flex;align-items:center;gap:8px;font-size:13px;margin:12px 0 14px;cursor:pointer}
.rem input{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:0 0 22px;border:3px solid var(--ink);border-radius:7px;margin:0;display:grid;place-content:center;background:#fff;cursor:pointer}
.rem input:checked{background:var(--green)}
.rem input:checked::after{content:"";width:9px;height:5px;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateY(-2px) rotate(-45deg)}
.go{width:100%;font:inherit;font-size:18px;color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:7px 0;background:var(--coral);cursor:pointer}
.go[disabled]{opacity:.6;cursor:default}
.err{min-height:22px;font-size:13px;margin-top:8px;text-align:center}
.note{font-size:12px;margin-top:14px;opacity:.75}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="gate">
  <div class="pic" aria-hidden="true">
    <svg viewBox="0 0 140 84" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#2F3542" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <rect x="8" y="10" width="124" height="66" rx="12" stroke-dasharray="7 6"/>

      <g class="float"><path d="M38 22v6"/><circle cx="38" cy="21" r="1.6" fill="#2F3542"/><rect x="24" y="28" width="28" height="24" rx="9" fill="#F2A497"/><circle cx="32.5" cy="38" r="4.2" fill="#F6D27A"/><circle cx="43.5" cy="38" r="4.2" fill="#F6D27A"/><path d="M34.5 46q3.5 3 7 0"/><path d="M29 60l3-5M47 60l-3-5"/></g>
    </g></svg>
  </div>
  <h1>SAA-C03 讀書計畫</h1>
  <p class="lead">這個頁面有密碼保護，請輸入密碼。</p>
  <form id="f" autocomplete="on">
    <label class="pw" for="pw">密碼</label>
    <div class="row">
      <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
      <button class="eye" id="eye" type="button" aria-pressed="false">顯示</button>
    </div>
    <label class="rem"><input type="checkbox" id="rem" checked>記住這台裝置，下次不用再輸入</label>
    <button class="go" id="go" type="submit">打開</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <div class="note">內容有加密，沒有密碼就看不到。</div>
</main>

(function(){
  var KEY = 'saa-study-gate', SYNC = 'saa-study-sync';
  var f = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go'),
      err = document.getElementById('err'), rem = document.getElementById('rem'), eye = document.getElementById('eye');
  function b64(s){ var bin = atob(s), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
  function tob64(buf){ var b = new Uint8Array(buf), s = ''; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
  function tob64url(buf){ return tob64(buf).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  var salt = b64(PAYLOAD.salt), iv = b64(PAYLOAD.iv), ct = b64(PAYLOAD.ct);
  if (PAYLOAD.numeric){ pw.setAttribute('inputmode', 'numeric'); }
  // document.open() is ignored while the page is still parsing, and document.write would then append the
  // site after the gate instead of replacing it (seen in Chrome on the remembered-device path, 2026-10-13).
  // So wait for the load event before swapping the page.
  function show(html){
    var go = function(){ document.open(); document.write(html); document.close(); };
    if (document.readyState === 'complete') setTimeout(go, 0);
    else window.addEventListener('load', function(){ setTimeout(go, 0); }, {once: true});
  }
  function unlock(key){ return crypto.subtle.decrypt({name: 'AES-GCM', iv: iv}, key, ct).then(function(pt){ return new TextDecoder().decode(pt); }); }
  function base(pass){ return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey', 'deriveBits']); }
  function derive(pass){
    return base(pass).then(function(b){
      return crypto.subtle.deriveKey({name: 'PBKDF2', salt: salt, iterations: PAYLOAD.iter, hash: 'SHA-256'}, b, {name: 'AES-GCM', length: 256}, true, ['decrypt']);
    });
  }
  // sync key for the progress server; must match sync_key.js
  function syncKey(pass){
    return base(pass).then(function(b){
      return crypto.subtle.deriveBits({name: 'PBKDF2', salt: new TextEncoder().encode('saa-study-sync-v1'), iterations: 150000, hash: 'SHA-256'}, b, 256);
    }).then(tob64url);
  }
  if (!window.crypto || !crypto.subtle){
    err.textContent = '這個瀏覽器沒辦法解密，請用 Safari 或 Chrome 打開。';
    go.disabled = true;
    return;
  }
  eye.addEventListener('click', function(){
    var on = pw.type === 'password'; pw.type = on ? 'text' : 'password';
    eye.textContent = on ? '隱藏' : '顯示'; eye.setAttribute('aria-pressed', on ? 'true' : 'false'); pw.focus();
  });
  var stored = null;
  try { stored = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (stored && stored.id === PAYLOAD.id){
    crypto.subtle.importKey('raw', b64(stored.k), {name: 'AES-GCM'}, true, ['decrypt']).then(unlock).then(show).catch(function(){
      try { localStorage.removeItem(KEY); } catch (e) {}
    });
  }
  f.addEventListener('submit', function(e){
    e.preventDefault();
    if (!pw.value) return;
    go.disabled = true; err.textContent = '解鎖中，請稍等…';
    var key, pass = pw.value;
    derive(pass).then(function(k){ key = k; return unlock(k); }).then(function(html){
      return syncKey(pass).then(function(sk){
        try {
          if (rem.checked){ localStorage.setItem(SYNC, sk); sessionStorage.removeItem(SYNC); }
          else { sessionStorage.setItem(SYNC, sk); localStorage.removeItem(SYNC); }
        } catch (e1) {}
        if (rem.checked){
          return crypto.subtle.exportKey('raw', key).then(function(raw){
            try { localStorage.setItem(KEY, JSON.stringify({id: PAYLOAD.id, k: tob64(raw)})); } catch (e2) {}
            show(html);
          });
        }
        try { localStorage.removeItem(KEY); } catch (e3) {}
        show(html);
      });
    }).catch(function(){
      go.disabled = false; err.textContent = '密碼不對，再試一次。';
      f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
      pw.select();
    });
  });
  pw.focus();
})();
